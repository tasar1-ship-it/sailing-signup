/* Sailing look. A navy sea header (title, language button, week switcher) ends in a wave over the page.
   Below it, one white card per day (Friday, Saturday, Sunday), each marked by a coloured pennant, with every
   child as a tap button; selected children turn sea blue. Since 1.10.0 only the children this phone remembers are shown.
   Phones: one column. From 900px wide the three day cards sit side by side. A sheet edits a child's note. */
:root{
  color-scheme:light dark;
  --bg:#F3F7FA; --card:#FFFFFF; --field:#FFFFFF; --fg:#0B2545; --fg-2:#4A5D73; --line:#D3DEE8;
  --sea:#0B6FB8; --sea-2:#13A0C9; --pick-1:#0B5E9E; --pick-2:#0C7BA8; --navy:#0B2545; --navy-2:#134074; --tint:#E3F0F8;
  --on-fg:#FFFFFF; --btn:#134074; --good:#13795B; --bad:#C2273B; --shadow:0 1px 2px rgba(11,37,69,.06),0 6px 20px rgba(11,37,69,.07);
  --f0:#2E9A5C; --f1:#2F7FC8; --f2:#2F7FC8; --f3:#2E9A5C; --sun:#F5A83A; --sun-soft:#FFCB80;
  --d0:#D9F0E0; --d0l:#8FCBA3; --d1:#DCEBF8; --d1l:#93BFE6; --d2:#C6DDF3; --d2l:#78ABDA; --d3:#EAF6EE; --d3l:#B3DEC0;
  --font:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#07121F; --card:#0F2236; --field:#132B44; --fg:#EAF2F8; --fg-2:#9FB3C8; --line:#24405E;
    --sea:#2F8FD8; --sea-2:#3DB8DC; --pick-1:#1F74B8; --pick-2:#0D78A6; --navy:#040C16; --navy-2:#0B2545; --tint:#16344F;
    --btn:#1F74B8; --good:#4CD3A3; --bad:#FF6B7D; --shadow:0 1px 2px rgba(0,0,0,.4);
    --d0:#13301F; --d0l:#33694A; --d1:#12263D; --d1l:#2E5785; --d2:#16304F; --d2l:#3A6A9E; --d3:#10261A; --d3l:#2A573C; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.hero{position:relative;color:#fff;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,#1B5E8C 100%);padding-top:env(safe-area-inset-top)}
.hero-in{max-width:640px;margin:0 auto;padding:14px calc(16px + env(safe-area-inset-right)) 54px calc(16px + env(safe-area-inset-left));position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.brand .logo{display:block;height:37px;width:auto}
.lang{position:relative;flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:2px 9px;min-height:20px;font-size:11px;font-weight:600;line-height:1.3;cursor:pointer}
/* Half-size look, full-size tap area. */
.lang::after{content:"";position:absolute;top:-12px;right:-10px;bottom:-12px;left:-10px}
h1{font-size:32px;margin:36px 0 6px;letter-spacing:-.01em;line-height:1.1;font-weight:700;color:var(--sun)}
.sub{color:var(--sun-soft);font-size:16px;font-weight:400;margin:0;max-width:34em}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:6px}
.week b{font-size:17px;text-align:center;flex:1;font-weight:600;color:var(--sun)}
.nav{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;display:block}
.wrap{max-width:640px;margin:0 auto;padding:4px calc(16px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.muted{color:var(--fg-2);font-size:16px;margin:0}
/* Weekdays (Wednesday, Friday) share a green family, the weekend (Saturday, Sunday) a stronger ocean blue; the later day of each pair is a shade deeper. */
.day0{--cardbg:var(--d0);--cardline:var(--d0l)} .day1{--cardbg:var(--d1);--cardline:var(--d1l);--cardbw:1.5px} .day2{--cardbg:var(--d2);--cardline:var(--d2l);--cardbw:1.5px} .day3{--cardbg:var(--d3);--cardline:var(--d3l)}
.card{background:var(--cardbg,var(--card));border-radius:18px;padding:16px 14px 14px;margin-bottom:14px;box-shadow:var(--shadow);border:var(--cardbw,1px) solid var(--cardline,var(--line))}
.card h2{font-size:21px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.card h2 .flag{width:22px;height:22px;flex:none}
.card h2 .dn{white-space:nowrap}
.card h2{flex-wrap:wrap;row-gap:6px}
.card h2 .n{margin-left:auto;font-size:15px;font-weight:600;color:var(--sea);background:var(--tint);border-radius:20px;padding:4px 10px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:22px;padding:9px 15px;min-height:44px;font-size:17px;font-weight:500;background:var(--field);color:var(--fg);cursor:pointer;text-align:left;line-height:1.2}
.chip[disabled]{opacity:.55;cursor:default}
/* A change not yet confirmed by the database (1.13.0): dimmed, with dots, until the server has it. */
.chip.wait{opacity:.6}
.chip.wait:after{content:"\00a0\2026"}
/* Selected names: white text stays at 4.5:1 or more across the whole gradient (1.9.2; was 3.0:1 at the light end). */
.chip.on{background:linear-gradient(135deg,var(--pick-1) 0%,var(--pick-2) 100%);border-color:transparent;color:var(--on-fg);font-weight:600}
.chip.on:before{content:"\2713\00a0"}
.chip small{display:block;font-size:14px;font-weight:500;opacity:.92}
.chip.on.sick{background:var(--field);color:var(--fg-2);border:1.5px dashed var(--line);font-weight:500}
.chip.on.sick:before{content:none}
.btn.sel{outline:2.5px solid var(--sea);outline-offset:1px;font-weight:700}
@media (hover:hover){ .chip:hover{border-color:var(--sea)} .chip.on:hover{filter:brightness(1.06)} }
.row{display:flex;gap:8px;margin-top:6px}
input[type=text],input[type=time]{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--fg)}
input[type=text]:focus,input[type=time]:focus{outline:none;border-color:var(--sea)}
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:48px;font-size:17px;font-weight:600;cursor:pointer;background:var(--tint);color:var(--fg)}
.btn.primary{background:var(--btn);color:#fff}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;margin-top:6px}
.sec{margin:22px 0 8px;font-size:16px;font-weight:600;color:var(--fg-2)}
.ok{color:var(--good);font-size:15px;margin:8px 2px 0;min-height:20px}
.err{color:var(--bad);font-size:15px;margin:6px 2px 0}
.bar{background:var(--bad);color:#fff;border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.shade{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,12,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:640px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:22px}
.sheet .row{margin-top:12px}
.foot{margin-top:30px;font-size:13px;color:var(--fg-2);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.foot svg{width:16px;height:16px}
.tools{max-width:640px}
.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.panel h2{font-size:19px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:22px;height:22px;color:var(--sea);flex:none}
.panel p{margin:0}
.helpl{display:inline-block;margin-top:3px;background:none;border:0;padding:4px 0;min-height:44px;color:#fff;font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.howto ol{margin:6px 0 0;padding-left:22px}
.howto li{margin:8px 0;font-size:16px;line-height:1.4}
.howto li b{color:var(--fg)}
.remind{border:1.5px solid var(--sea);background:linear-gradient(180deg,var(--tint),var(--card) 80%)}
.remind .btn{margin-top:12px}
.alt{display:inline-block;margin-top:2px;min-height:44px;color:var(--sea);font-size:15px;font-weight:600;background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline}
/* Shown when the connection fails, or is still loading after 5 seconds (1.9.1). */
.retry{display:inline-block;margin-top:14px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.16);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.slow .btn{margin-top:10px}
.remind.done{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border:1px solid var(--line)}
.remind.done svg{width:22px;height:22px;color:var(--good);flex:none}
.remind.done p{flex:1;color:var(--fg-2);font-size:15px}
.remind.done .alt{margin:0}
/* Find your child (1.10.0): a parent types the name; only matches appear. Then "On this phone" lists their own children. */
.find{border:1.5px solid var(--sea)}
.find .row{margin-top:12px}
.find .chips{margin-top:12px}
.find .btn.wide{margin-top:12px}
.hint{color:var(--fg-2);font-size:15px;margin:10px 2px 0}
.mine ul{list-style:none;margin:4px 0 0;padding:0}
.mine li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.mine li .alt{font-weight:500;color:var(--fg-2)}
.summary{margin-top:26px}
/* Summary: weekdays in the left column (Wednesday above Friday), the weekend in the right (Saturday above Sunday);
   each day a bullet list of names. */
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto;grid-auto-flow:column;gap:16px 18px;margin-top:4px;align-items:start}
.sum-day{min-width:0}
.sum-day b{display:block;font-size:16px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sum-day b span{white-space:nowrap}
@media (max-width:360px){ .sum-day b{font-size:14px} .summary .sum-grid{gap:16px 12px} }
.sum-day ul{margin:6px 0 0;padding-left:20px}
.sum-day li{font-size:16px;margin:3px 0;overflow-wrap:anywhere}
.sum-day li span{color:var(--fg-2);font-size:14px}
.sum-day li.sick{color:var(--fg-2)}
/* The coach's plan for the day (1.9.0), entered on the coaches' dashboard. */
.plan{margin:-2px 0 12px;padding:8px 11px;border-radius:12px;background:var(--field);border:1px solid var(--cardline,var(--line));font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.plan span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-bottom:2px}
/* When the coaches last changed the day's plan (1.11.0), in normal case after the "PLAN" label. */
.plan .upd{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none}
.sum-day .sp{display:block;font-size:14px;font-weight:500;color:var(--fg-2);margin-top:2px}
.sum-day p{font-size:15px;margin:6px 0 0}
.none{color:var(--fg-2);font-style:italic}
a.btn{display:block;text-align:center;text-decoration:none;line-height:24px}
@media (min-width:900px){ .remind{max-width:640px} }
@media (min-width:900px){
  .hero-in{max-width:1100px;padding:20px 32px 70px}
  h1{font-size:44px}
  .week{max-width:520px}
  .wave{height:70px}
  .wrap{max-width:1100px;padding-left:32px;padding-right:32px}
  .days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .days .card{margin:0;padding:20px 18px 18px}
  .tools{margin-top:24px}
  .shade{align-items:center}
  .sheet{max-width:460px;border-radius:20px}
}
@media (min-width:1200px){ .days{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>

     Elsewhere: download it; Mac Calendar or Outlook opens it. */
  var url = URL.createObjectURL(new Blob([icsText()], { type: 'text/calendar;charset=utf-8' }));
  if (IOS) { location.href = url; }
  else {
    var a = document.createElement('a');
    a.href = url; a.download = 'recordatorio-vela.ics'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  remDone();
}
function remDone() { lsSet('rem', '1'); S.remAlt = false; setTimeout(render, 300); }

/* ---------- render ---------- */
/* Parents' "how it works": closed until the link under the intro opens it; the same link closes it. */
function helpOpen() { return !!S.help; }
function helpHtml(l) {
  if (!helpOpen()) { return ''; }
  var items = [], i;
  for (i = 0; i < l.help.length; i++) { items.push('<li>' + esc(l.help[i]).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</li>'); }
  return '<section class="panel howto"><h2>' + LIST + esc(l.helpT) + '</h2><ol>' + items.join('') + '</ol></section>';
}
/* First visit, or "add another child": type a name, tap the match. Only matching names are shown, never the whole list. */
function findRes(l) {
  var q = clean(S.q, 30), m = matches(q), all = kidList(), exact = false, h = '', j;
  if (norm(q).length < 2) { return '<p class="hint">' + esc(l.findMore) + '</p>'; }
  for (j = 0; j < all.length; j++) { if (norm(all[j].name) === norm(q)) { exact = true; } }
  if (m.length) {
    h += '<div class="chips">';
    for (j = 0; j < m.length; j++) { h += '<button class="chip" data-a="mine" data-k="' + esc(m[j].id) + '">' + esc(m[j].name) + '</button>'; }
    h += '</div>';
  } else if (!exact) { h += '<p class="hint">' + esc(l.findNone) + '</p>'; }
  /* Not when what was typed is just the start of a listed name (1.14.0/1.14.1): after "Te" the button "Añadir «Te»"
     stood next to "Test child" and invited junk names. "Daniela" next to "Dani" still offers to add Daniela. */
  if (!exact && !startOfMatch(q, m)) { h += '<button class="btn wide" data-a="add">' + esc(l.addNew(q)) + '</button>'; }
  return h;
}
function findHtml(l, mine) {
  return '<section class="panel find"><h2>' + KID + esc(l.findT) + '</h2>' + (S.gone ? '<p class="err">' + esc(l.gone) + '</p>' : '') + '<p class="muted">' + esc(l.findText) + '</p>' +
    '<div class="row"><input type="text" id="find" maxlength="30" placeholder="' + esc(l.kidPh) + '" value="' + esc(S.q) + '" autocomplete="off" autocapitalize="words"></div>' +
    '<div id="findres">' + findRes(l) + '</div>' + (mine.length ? '<button class="alt" data-a="finddone">' + esc(l.done) + '</button>' : '') + '</section>';
}
function mineHtml(l, mine) {
  var h = '<section class="panel mine"><h2>' + KID + esc(l.mineT) + '</h2><ul>', j;
  for (j = 0; j < mine.length; j++) { h += '<li><span>' + esc(mine[j].name) + '</span><button class="alt" data-a="unmine" data-k="' + esc(mine[j].id) + '">' + esc(l.unmine) + '</button></li>'; }
  h += '</ul>' + (S.find ? '' : '<button class="alt" data-a="find">' + esc(l.addOther) + '</button>');
  return h + (S.msg ? '<p class="ok">' + esc(S.msg()) + '</p>' : '') + '</section>';
}
function remindHtml(l) {
  var google = ANDROID ? !S.remAlt : !!S.remAlt;
  if (lsGet('rem') === '1') {
    return '<section class="panel remind done">' + CHECK + '<p>' + esc(l.remDone) + '</p><button class="alt" data-a="remagain">' + esc(l.remAgain) + '</button></section>';
  }
  return '<section class="panel remind"><h2>' + BELL + esc(l.remTitle) + '</h2><p class="muted">' + esc(l.remText) + '</p>' +
    (google ? '<a class="btn primary wide" data-a="remg" href="' + esc(googleUrl()) + '" target="_blank" rel="noopener">' + esc(l.remGoogle) + '</a>'
            : '<button class="btn primary wide" data-a="remics">' + esc(l.remIcs) + '</button>') +
    '<button class="alt" data-a="remalt">' + esc(google ? l.remAltIcs : l.remAltGoogle) + '</button></section>';
}
function nudgeHref(l) {
  var n = S.nudge, tm = /^(\d{1,2}):(\d{2})$/.exec(n.note), hhmm = tm ? pad(+tm[1]) + ':' + tm[2] : '';
  return 'https://wa.me/?text=' + encodeURIComponent(l.lateMsg({ name: n.name, day: l.days[n.day], date: n.date, time: hhmm, note: tm ? '' : n.note }));
}
function render() {
  var l = L(), h = [];
  document.documentElement.lang = lang;
  document.title = l.pageTitle;
  h.push('<header class="hero"><div class="hero-in"><div class="top"><div class="brand">' + '<img class="logo" src="cna-logo-white.png" width="80" height="37" alt="Club Nàutic Arenal">' + '</div><button class="lang" data-a="lang" lang="' + (lang === 'es' ? 'en' : 'es') + '">' + esc(l.other) + '</button></div><h1>' + esc(l.title) + '</h1>');
  if (S.fatal) { app.innerHTML = h.join('') + '<p class="sub">' + esc(S.fatal()) + '</p>' + (S.canRetry ? '<button class="retry" data-a="retry">' + esc(l.retry) + '</button>' : '') + '</div>' + WAVE + '</header>'; return; }
  var kids = myKids(), o, d, j, p, on, date, mp;
  h.push('<p class="sub">' + esc(l.intro) + '</p><button class="helpl" data-a="help" aria-expanded="' + (helpOpen() ? 'true' : 'false') + '">' + esc(l.helpLink) + '</button>');
  h.push('<div class="week"><button class="nav" data-a="prev" aria-label="' + esc(l.prev) + '">‹</button><b>' + esc(l.weekend + ' ' + weekLabel(S.week)) + '</b><button class="nav" data-a="next" aria-label="' + esc(l.next) + '">›</button></div>');
  h.push('</div>' + WAVE + '</header><main class="wrap">');
  if (S.offline) { h.push('<div class="bar">' + esc(l.offline) + '</div>'); }
  h.push(helpHtml(l));
  /* The find box comes first: on a first visit it is the one thing to do. */
  if (S.loadedKids && (S.find || !kids.length)) { h.push(findHtml(l, kids)); }
  h.push(remindHtml(l));
  if (S.err) { h.push('<p class="err">' + esc(S.err()) + '</p>'); }
  if (!S.loadedKids) { h.push('<p class="muted">' + esc(l.loading) + '</p>'); }
  if (!S.loadedKids && S.slow) { h.push('<div class="slow"><p class="muted">' + esc(l.slow) + '</p><button class="btn" data-a="retry">' + esc(l.retry) + '</button></div>'); }
  if (!S.loadedKids || !kids.length) { h.push('<p class="foot">' + ANCHOR + '<span>v' + VERSION + '</span></p></main>'); paint(h); return; }
  if (!picksReady()) { h.push('<p class="muted">' + esc(l.loading) + '</p>'); }
  h.push('<div class="days">');
  for (o = 0; o < ORDER.length; o++) {
    d = ORDER[o];
    date = dayDate(S.week, d);
    p = S.picks[d] || {};
    h.push('<section class="card day' + d + '"><h2>' + flag(d) + '<span class="dn">' + esc(l.days[d]) + ' ' + date.getDate() + '</span><span class="n">' + esc(l.count(sailing(picked(d)))) + '</span></h2>' +
      (planText(d) ? '<p class="plan"><span>' + esc(l.planT) + (planWhen(d) ? ' · <em class="upd">' + esc(planWhen(d)) + '</em>' : '') + '</span>' + esc(planText(d)) + '</p>' : '') + '<div class="chips">');
    for (j = 0; j < kids.length; j++) {
      on = p[kids[j].id];
      h.push('<button class="chip' + (on ? ' on' : '') + (on && parseNote(on.note).st === 'sick' ? ' sick' : '') + (pending(d, kids[j].id) ? ' wait' : '') + '" data-a="chip" data-d="' + d + '" data-k="' + esc(kids[j].id) + '" aria-pressed="' + (on ? 'true' : 'false') + '"' + (picksReady() ? '' : ' disabled') + '>' +
        esc(kids[j].name) + (on && on.note ? '<small>' + esc(showNote(on.note)) + '</small>' : '') + '</button>');
    }
    h.push('</div></section>');
  }
  h.push('</div><div class="tools">');
  h.push(mineHtml(l, kids));
  /* Summary: each day's number of sailors, and by name only this phone's children. */
  h.push('<section class="panel summary"><h2>' + LIST + esc(l.sumTitle) + '</h2><div class="sum-grid">');
  for (o = 0; o < ORDER.length; o++) {
    d = ORDER[o];
    p = picked(d); mp = [];
    for (j = 0; j < p.length; j++) { if (mineIds().indexOf(p[j].id) >= 0) { mp.push(p[j]); } }
    h.push('<div class="sum-day"><b><span>' + esc(l.days[d]) + ' ' + dayDate(S.week, d).getDate() + '</span> <span>· ' + sailing(p) + '</span></b>' + (planText(d) ? '<span class="sp">' + esc(planText(d)) + '</span>' : ''));
    if (mp.length) {
      h.push('<ul>');
      for (j = 0; j < mp.length; j++) { h.push('<li' + (mp[j].sick ? ' class="sick"' : '') + '>' + esc(mp[j].name) + (mp[j].note ? ' <span>(' + esc(showNote(mp[j].note)) + ')</span>' : '') + '</li>'); }
      h.push('</ul>');
    } else if (!p.length) { h.push('<p class="none">' + esc(l.nobody) + '</p>'); }
    h.push('</div>');
  }
  h.push('</div></section>');
  h.push('</div><p class="foot">' + ANCHOR + '<span>v' + VERSION + '</span></p></main>');
  if (S.nudge) {
    var tm = /^(\d{1,2}):(\d{2})$/.exec(S.nudge.note), hhmm = tm ? pad(+tm[1]) + ':' + tm[2] : '';
    h.push('<div class="shade" data-a="nudgeoff"><div class="sheet" role="dialog" aria-modal="true"><h3>' + MARKS.late + ' ' + esc(S.nudge.name) + '</h3>' +
      '<div class="sec" style="margin-top:4px"><label for="lateAt">' + esc(l.lateAt) + '</label></div><div class="row"><input type="time" id="lateAt" value="' + esc(hhmm) + '"></div>' +
      /* Offline, the panel does not claim "Guardado en la lista" (1.14.0); it shows the offline text instead. */
      '<p class="muted">' + esc(S.offline ? l.offline : l.lateAsk) + '</p>' +
      '<a class="btn primary wide" data-a="nudge" href="' + esc(nudgeHref(l)) + '" target="_blank" rel="noopener">' + esc(l.lateSend) + '</a>' +
      '<button class="btn wide" data-a="nudgeoff">' + esc(l.lateSkip) + '</button></div></div>');
  }
  /* Another parent removed this sign-up while the sheet was open: close it rather than act on a sign-up that is gone. */
  if (S.sheet && picksReady() && !live(S.sheet)) { S.sheet = null; }
  if (S.sheet && S.kids[S.sheet.kid]) {
    S.sheet.st = liveSt(S.sheet);
    h.push('<div class="shade" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><h3>' + esc(S.kids[S.sheet.kid].name) + '</h3><p class="muted">' + esc(l.days[S.sheet.day]) + ' ' + dayDate(S.week, S.sheet.day).getDate() + '</p>' +
      '<div class="row"><button class="btn' + (S.sheet.st === 'sick' ? ' sel' : '') + '" data-a="sick" style="flex:1">' + MARKS.sick + ' ' + esc(l.sick) + '</button><button class="btn' + (S.sheet.st === 'late' ? ' sel' : '') + '" data-a="late" style="flex:1">' + MARKS.late + ' ' + esc(l.late) + '</button></div>' +
      '<div class="row"><input type="text" id="note" maxlength="36" placeholder="' + esc(l.notePh) + '" value="' + esc(S.sheet.note) + '"></div>' +
      '<div class="row"><button class="btn primary" data-a="save" style="flex:1">' + esc(l.saveNote) + '</button><button class="btn danger" data-a="remove">' + esc(l.remove) + '</button></div>' +
      '<button class="btn wide" data-a="close">' + esc(l.close) + '</button></div></div>');
  }
  paint(h);
}
/* Database updates redraw at once (1.14.0; 1.13.0 held them while someone typed, and the held redraw threw away a note
   being typed). Only the open "late" panel is left alone: a redraw there replaced the WhatsApp button under the finger,
   so the first tap did nothing on iPhone. The updates are drawn when the panel closes. */
function renderData() { if (S.nudge) { return; } render(); }
/* Live updates re-render the page; keep the cursor in a text box someone is typing in. */
function paint(h) {
  var f = document.activeElement, fid = f && f.id, fv = fid && f.value, fs = fid && f.selectionStart;
  app.innerHTML = h.join('');
  if (fid && document.getElementById(fid)) {
    f = document.getElementById(fid); f.value = fv; f.focus();
    try { f.setSelectionRange(fs, fs); } catch (e) {}
  }
}

app.addEventListener('click', function (ev) {
  var t = ev.target, a;
  while (t && t !== app && !t.getAttribute('data-a')) { t = t.parentNode; }
  if (!t || t === app) { return; }
  a = t.getAttribute('data-a');
  if ((a === 'close' || a === 'nudgeoff') && t.className === 'shade' && ev.target !== t) { return; }
  if (a === 'chip') { tapChip(+t.getAttribute('data-d'), t.getAttribute('data-k')); }
  else if (a === 'retry') { location.reload(); }
  else if (a === 'prev' || a === 'next') { S.week += a === 'next' ? 1 : -1; S.msg = null; S.err = null; watchWeek(); render(); }
  else if (a === 'save') { saveNote(); }
  else if (a === 'remove') { removePick(); }
  else if (a === 'sick' || a === 'late') { setStatus(a); }
  else if (a === 'nudge') { S.nudge = null; setTimeout(render, 300); }
  else if (a === 'nudgeoff') { S.nudge = null; render(); }
  else if (a === 'close') { S.sheet = null; render(); }
  else if (a === 'add') { addKid(); }
  else if (a === 'mine') { S.msg = null; pickMine(t.getAttribute('data-k')); }
  else if (a === 'unmine') { unMine(t.getAttribute('data-k')); }
  else if (a === 'find') { S.find = true; S.q = ''; S.msg = null; render(); var fi = document.getElementById('find'); if (fi) { fi.focus(); } }
  else if (a === 'finddone') { S.find = false; S.q = ''; render(); }
  else if (a === 'remics') { openIcs(); }
  else if (a === 'remg') { remDone(); }
  else if (a === 'remalt') { S.remAlt = !S.remAlt; render(); }
  else if (a === 'remagain') { lsSet('rem', ''); render(); }
  else if (a === 'help') {
    if (helpOpen()) { S.help = false; render(); }
    else { S.help = true; render(); var hp = document.querySelector('.howto'); if (hp && hp.scrollIntoView) { hp.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } }
  }
  else if (a === 'lang') { lang = lang === 'es' ? 'en' : 'es'; lsSet('lang', lang); render(); }
});
/* Typing only redraws the matches, so the phone keyboard and its suggestions are not disturbed. */
app.addEventListener('input', function (ev) {
  if (ev.target.id !== 'find') { return; }
  S.q = ev.target.value;
  var r = document.getElementById('findres'); if (r) { r.innerHTML = findRes(L()); }
});
/* A time picked after "late" replaces the note, so the list and the WhatsApp text both carry it. */
app.addEventListener('change', function (ev) {
  var n = S.nudge;
  if (ev.target.id !== 'lateAt' || !n) { return; }
  n.note = ev.target.value;
  sendPick(n.w, n.day, n.kid, { note: makeNote('late', n.note), at: n.at });
  var b = document.querySelector('a[data-a="nudge"]'); if (b) { b.href = nudgeHref(L()); }
});
app.addEventListener('keydown', function (ev) {
  if (ev.keyCode !== 13) { return; }
  /* Enter takes the one match only when what was typed is the start of its name (1.14.1): "Daniela" + Enter took "Dani". */
  if (ev.target.id === 'find') { var m = matches(S.q), sm = m.length === 1 ? startOfMatch(S.q, m) : null; if (sm) { pickMine(sm.id); } }
  else if (ev.target.id === 'note') { saveNote(); }
});

/* ---------- start ---------- */
var g = (location.hash || '').replace(/^#/, '');
if (window.SS_PREVIEW) { store = memStore(window.SS_PREVIEW); }
else if (/[?&]demo\b/.test(location.search)) { store = memStore(); }
else if (/^[A-Za-z0-9]{20,40}$/.test(g)) { store = fbStore(g); }
else { S.fatal = say('noLink'); render(); return; }
store.ready['catch'](function (e) { S.fatal = say('connFail', e); S.canRetry = true; render(); });
/* A slow or hanging connection: after 5 s offer a retry instead of a silent "Cargando…" (1.9.1). */
setTimeout(function () { if (!S.loadedKids && !S.fatal) { S.slow = true; render(); } }, 5000);
store.onKids(function (v) { S.kids = v; S.loadedKids = true; pruneMine(); renderData(); });
store.onConn(function (c) { if (c) { S.wasOn = true; } S.offline = S.wasOn && !c; renderData(); });
watchWeek();
document.addEventListener('visibilitychange', resume);
window.addEventListener('pageshow', resume);
render();
})();
</script>
