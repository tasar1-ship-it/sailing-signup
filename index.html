<title>Vela · Fin de semana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071E3'/%3E%3Cpath d='M16 5v19M16 6l8 15h-8M15 8L8 21h7M6 25h20' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
/* Sailing look. A navy sea header (title, language button, week switcher) ends in a wave over the page.
   Below it, one white card per day (Friday, Saturday, Sunday), each marked by a coloured pennant, with every
   child as a tap button; selected children turn sea blue. Then "copy for WhatsApp" and "add a child".
   Phones: one column. From 900px wide the three day cards sit side by side. A sheet edits a child's note. */
:root{
  color-scheme:light dark;
  --bg:#F3F7FA; --card:#FFFFFF; --field:#FFFFFF; --fg:#0B2545; --fg-2:#4A5D73; --line:#D3DEE8;
  --sea:#0B6FB8; --sea-2:#13A0C9; --navy:#0B2545; --navy-2:#134074; --tint:#E3F0F8;
  --on-fg:#FFFFFF; --btn:#134074; --good:#13795B; --bad:#C2273B; --shadow:0 1px 2px rgba(11,37,69,.06),0 6px 20px rgba(11,37,69,.07);
  --f0:#2E9A5C; --f1:#2F7FC8; --f2:#2F7FC8; --f3:#2E9A5C; --sun:#F5A83A; --sun-soft:#FFCB80;
  --d0:#D9F0E0; --d0l:#8FCBA3; --d1:#DCEBF8; --d1l:#93BFE6; --d2:#C6DDF3; --d2l:#78ABDA; --d3:#EAF6EE; --d3l:#B3DEC0;
  --font:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#07121F; --card:#0F2236; --field:#132B44; --fg:#EAF2F8; --fg-2:#9FB3C8; --line:#24405E;
    --sea:#2F8FD8; --sea-2:#3DB8DC; --navy:#040C16; --navy-2:#0B2545; --tint:#16344F;
    --btn:#1F74B8; --good:#4CD3A3; --bad:#FF6B7D; --shadow:0 1px 2px rgba(0,0,0,.4);
    --d0:#13301F; --d0l:#33694A; --d1:#12263D; --d1l:#2E5785; --d2:#16304F; --d2l:#3A6A9E; --d3:#10261A; --d3l:#2A573C; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.hero{position:relative;color:#fff;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,#1B5E8C 100%);padding-top:env(safe-area-inset-top)}
.hero-in{max-width:640px;margin:0 auto;padding:14px calc(16px + env(safe-area-inset-right)) 54px calc(16px + env(safe-area-inset-left));position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.brand .logo{display:block;height:37px;width:auto}
.lang{position:relative;flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:2px 9px;min-height:20px;font-size:11px;font-weight:600;line-height:1.3;cursor:pointer}
/* Half-size look, full-size tap area. */
.lang::after{content:"";position:absolute;inset:-12px -10px}
h1{font-size:32px;margin:36px 0 6px;letter-spacing:-.01em;line-height:1.1;font-weight:700;color:var(--sun)}
.sub{color:var(--sun-soft);font-size:16px;font-weight:400;margin:0;max-width:34em}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:6px}
.week b{font-size:17px;text-align:center;flex:1;font-weight:600;color:var(--sun)}
.nav{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;display:block}
.wrap{max-width:640px;margin:0 auto;padding:4px calc(16px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.muted{color:var(--fg-2);font-size:16px;margin:0}
/* Weekdays (Wednesday, Friday) share a green family, the weekend (Saturday, Sunday) a stronger ocean blue; the later day of each pair is a shade deeper. */
.day0{--cardbg:var(--d0);--cardline:var(--d0l)} .day1{--cardbg:var(--d1);--cardline:var(--d1l);--cardbw:1.5px} .day2{--cardbg:var(--d2);--cardline:var(--d2l);--cardbw:1.5px} .day3{--cardbg:var(--d3);--cardline:var(--d3l)}
.card{background:var(--cardbg,var(--card));border-radius:18px;padding:16px 14px 14px;margin-bottom:14px;box-shadow:var(--shadow);border:var(--cardbw,1px) solid var(--cardline,var(--line))}
.card h2{font-size:21px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.card h2 .flag{width:22px;height:22px;flex:none}
.card h2 .dn{white-space:nowrap}
.card h2{flex-wrap:wrap;row-gap:6px}
.card h2 .n{margin-left:auto;font-size:15px;font-weight:600;color:var(--sea);background:var(--tint);border-radius:20px;padding:4px 10px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:22px;padding:9px 15px;min-height:44px;font-size:17px;font-weight:500;background:var(--field);color:var(--fg);cursor:pointer;text-align:left;line-height:1.2}
.chip.on{background:linear-gradient(135deg,var(--sea) 0%,var(--sea-2) 100%);border-color:transparent;color:var(--on-fg);font-weight:600}
.chip.on:before{content:"\2713\00a0"}
.chip small{display:block;font-size:14px;font-weight:500;opacity:.92}
@media (hover:hover){ .chip:hover{border-color:var(--sea)} .chip.on:hover{filter:brightness(1.06)} }
.row{display:flex;gap:8px;margin-top:6px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--fg)}
input[type=text]:focus{outline:none;border-color:var(--sea)}
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:48px;font-size:17px;font-weight:600;cursor:pointer;background:var(--tint);color:var(--fg)}
.btn.primary{background:var(--btn);color:#fff}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;margin-top:6px}
.sec{margin:22px 0 8px;font-size:16px;font-weight:600;color:var(--fg-2)}
.ok{color:var(--good);font-size:15px;margin:8px 2px 0;min-height:20px}
.err{color:var(--bad);font-size:15px;margin:6px 2px 0}
.bar{background:var(--bad);color:#fff;border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.shade{position:fixed;inset:0;background:rgba(4,12,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:22px}
.sheet .row{margin-top:12px}
.foot{margin-top:30px;font-size:13px;color:var(--fg-2);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.foot svg{width:16px;height:16px}
.tools{max-width:640px}
.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.panel h2{font-size:19px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:22px;height:22px;color:var(--sea);flex:none}
.panel p{margin:0}
.helpl{display:inline-block;margin-top:10px;background:none;border:0;padding:4px 0;color:#fff;font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.howto ol{margin:6px 0 0;padding-left:22px}
.howto li{margin:8px 0;font-size:16px;line-height:1.4}
.howto li b{color:var(--fg)}
.remind{border:1.5px solid var(--sea);background:linear-gradient(180deg,var(--tint),var(--card) 80%)}
.remind .btn{margin-top:12px}
.alt{display:inline-block;margin-top:10px;color:var(--sea);font-size:15px;font-weight:600;background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline}
.remind.done{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border:1px solid var(--line)}
.remind.done svg{width:22px;height:22px;color:var(--good);flex:none}
.remind.done p{flex:1;color:var(--fg-2);font-size:15px}
.remind.done .alt{margin:0}
.summary{margin-top:26px}
/* Summary: weekdays in the left column (Wednesday above Friday), the weekend in the right (Saturday above Sunday);
   each day a bullet list of names. */
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto;grid-auto-flow:column;gap:16px 18px;margin-top:4px;align-items:start}
.sum-day{min-width:0}
.sum-day b{display:block;font-size:16px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sum-day b span{white-space:nowrap}
@media (max-width:360px){ .sum-day b{font-size:14px} .summary .sum-grid{gap:16px 12px} }
.sum-day ul{margin:6px 0 0;padding-left:20px}
.sum-day li{font-size:16px;margin:3px 0;overflow-wrap:anywhere}
.sum-day li span{color:var(--fg-2);font-size:14px}
.sum-day p{font-size:15px;margin:6px 0 0}
.none{color:var(--fg-2);font-style:italic}
a.btn{display:block;text-align:center;text-decoration:none;line-height:24px}
@media (min-width:900px){ .remind{max-width:640px} }
@media (min-width:900px){
  .hero-in{max-width:1100px;padding:20px 32px 70px}
  h1{font-size:44px}
  .week{max-width:520px}
  .wave{height:70px}
  .wrap{max-width:1100px;padding-left:32px;padding-right:32px}
  .days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .days .card{margin:0;padding:20px 18px 18px}
  .tools{margin-top:24px}
  .shade{align-items:center}
  .sheet{max-width:460px;border-radius:20px}
}
@media (min-width:1200px){ .days{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>

      return function () { if (r) { r.off(); } };
    },
    setPick: function (w, day, kid, v) {
      return ready.then(function (db) {
        var r = base(db).child('picks/' + w + '/' + day + '/' + kid);
        return v ? r.set({ note: v.note, at: v.at || firebase.database.ServerValue.TIMESTAMP }) : r.remove();
      });
    },
    addKid: function (name) {
      return ready.then(function (db) { return base(db).child('kids').push({ name: name, at: firebase.database.ServerValue.TIMESTAMP }); });
    },
    onConn: function (cb) { ready.then(function (db) { db.ref('.info/connected').on('value', function (s) { cb(!!s.val()); }); }); }
  };
}
function memStore(names) {
  var kids = {}, picks = {}, kcb = null, pcbs = {}, n = 0;
  (names || ['Ana', 'Bruno', 'Carla', 'Dani', 'Eva']).forEach(function (nm) { kids['-demo' + (n++)] = { name: nm, at: n }; });
  function emitP(w) { if (pcbs[w]) { pcbs[w](JSON.parse(JSON.stringify(picks[w] || {}))); } }
  return {
    ready: Promise.resolve(),
    onKids: function (cb) { kcb = cb; setTimeout(function () { cb(kids); }, 0); },
    onPicks: function (w, cb) { pcbs[w] = cb; setTimeout(function () { emitP(w); }, 0); return function () { delete pcbs[w]; }; },
    setPick: function (w, day, kid, v) {
      picks[w] = picks[w] || {}; picks[w][day] = picks[w][day] || {};
      if (v) { picks[w][day][kid] = { note: v.note, at: v.at || new Date().getTime() }; } else { delete picks[w][day][kid]; }
      emitP(w); return Promise.resolve();
    },
    addKid: function (name) { kids['-demo' + (n++)] = { name: name, at: n }; kcb(kids); return Promise.resolve(); },
    onConn: function () {}
  };
}
function onFail(e) { S.fatal = say('readFail', (e && e.code) || 'error'); render(); }

/* ---------- actions ---------- */
function watchWeek() {
  if (offPicks) { offPicks(); }
  S.picks = {};
  offPicks = store.onPicks(weekId(S.week), function (v) { S.picks = v; render(); });
}
function fail(e) { S.err = say('saveFail', (e && e.code) || e || 'error'); render(); }
function tapChip(day, kid) {
  S.err = null; S.msg = null;
  var p = (S.picks[day] || {})[kid];
  if (!p) { store.setPick(weekId(S.week), day, kid, { note: '' })['catch'](fail); return; }
  S.sheet = { day: day, kid: kid, note: p.note || '', at: p.at }; render();
  var i = document.getElementById('note'); if (i) { i.focus(); }
}
function saveNote() {
  var sh = S.sheet, i = document.getElementById('note');
  S.sheet = null;
  store.setPick(weekId(S.week), sh.day, sh.kid, { note: clean(i ? i.value : '', 40), at: sh.at })['catch'](fail);
  render();
}
function removePick() {
  var sh = S.sheet; S.sheet = null;
  store.setPick(weekId(S.week), sh.day, sh.kid, null)['catch'](fail);
  render();
}
function addKid() {
  var i = document.getElementById('newkid'), name = clean(i ? i.value : '', 30), list = kidList(), j;
  S.err = null; S.msg = null;
  if (!name) { return; }
  for (j = 0; j < list.length; j++) {
    if (list[j].name.toLowerCase() === name.toLowerCase()) { S.err = say('dup', name); render(); return; }
  }
  S.draftKid = '';
  store.addKid(name).then(function () { S.msg = say('added', name); S.msgAt = 'add'; render(); })['catch'](fail);
}
/* The shareable address of this group's page (the preview copy passes its group id in SS_PREVIEW_G). */
var BASE = 'https://tasar1-ship-it.github.io/sailing-signup/';
function groupLink() { var id = window.SS_PREVIEW_G || g; return BASE + (id ? '#' + id : ''); }

/* ---------- Monday reminder: a weekly calendar event at 17:00 local time, with the link inside ---------- */
var UA = navigator.userAgent || '';
var IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
var ANDROID = /Android/.test(UA);
function nextMonday() {
  var now = new Date(), d = new Date(); d.setHours(17, 0, 0, 0);
  var add = (8 - d.getDay()) % 7;
  if (add === 0 && now > d) { add = 7; }
  d.setDate(d.getDate() + add);
  return d;
}
function stamp(d, h, m) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(h) + pad(m) + '00'; }
function icsEsc(t) { return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function fold(line) { var out = [], i; for (i = 0; i < line.length; i += 60) { out.push((i ? ' ' : '') + line.slice(i, i + 60)); } return out.join('\r\n'); }
function icsText() {
  var l = L(), d = nextMonday(), now = new Date(), link = groupLink(), desc = l.calDesc + '\n' + link;
  var utc = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';
  var rows = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//sailing-signup//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', 'UID:' + now.getTime() + '-' + Math.floor(Math.random() * 1e9) + '@sailing-signup', 'DTSTAMP:' + utc,
    'DTSTART:' + stamp(d, 17, 0), 'DTEND:' + stamp(d, 17, 15), 'RRULE:FREQ=WEEKLY;BYDAY=MO',
    'SUMMARY:' + icsEsc('⛵ ' + l.calTitle), 'DESCRIPTION:' + icsEsc(desc), 'URL:' + link,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(l.calTitle), 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'];
  var j; for (j = 0; j < rows.length; j++) { rows[j] = fold(rows[j]); }
  return rows.join('\r\n') + '\r\n';
}
function googleUrl() {
  var l = L(), d = nextMonday();
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('⛵ ' + l.calTitle) +
    '&dates=' + stamp(d, 17, 0) + '/' + stamp(d, 17, 15) + '&ctz=Europe/Madrid&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=MO') +
    '&details=' + encodeURIComponent(l.calDesc + '\n' + groupLink());
}
function openIcs() {
  /* iPhone: open the calendar file itself, so iOS shows its "Add to Calendar" sheet (WebKit refuses data: links here).
     Elsewhere: download it; Mac Calendar or Outlook opens it. */
  var url = URL.createObjectURL(new Blob([icsText()], { type: 'text/calendar;charset=utf-8' }));
  if (IOS) { location.href = url; }
  else {
    var a = document.createElement('a');
    a.href = url; a.download = 'recordatorio-vela.ics'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  remDone();
}
function remDone() { lsSet('rem', '1'); S.remAlt = false; setTimeout(render, 300); }

/* ---------- render ---------- */
/* Parents' "how it works": closed until the link under the intro opens it; the same link closes it. */
function helpOpen() { return !!S.help; }
function helpHtml(l) {
  if (!helpOpen()) { return ''; }
  var items = [], i;
  for (i = 0; i < l.help.length; i++) { items.push('<li>' + esc(l.help[i]).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</li>'); }
  return '<section class="panel howto"><h2>' + LIST + esc(l.helpT) + '</h2><ol>' + items.join('') + '</ol></section>';
}
function remindHtml(l) {
  var google = ANDROID ? !S.remAlt : !!S.remAlt;
  if (lsGet('rem') === '1') {
    return '<section class="panel remind done">' + CHECK + '<p>' + esc(l.remDone) + '</p><button class="alt" data-a="remagain">' + esc(l.remAgain) + '</button></section>';
  }
  return '<section class="panel remind"><h2>' + BELL + esc(l.remTitle) + '</h2><p class="muted">' + esc(l.remText) + '</p>' +
    (google ? '<a class="btn primary wide" data-a="remg" href="' + esc(googleUrl()) + '" target="_blank" rel="noopener">' + esc(l.remGoogle) + '</a>'
            : '<button class="btn primary wide" data-a="remics">' + esc(l.remIcs) + '</button>') +
    '<button class="alt" data-a="remalt">' + esc(google ? l.remAltIcs : l.remAltGoogle) + '</button></section>';
}
function render() {
  var l = L(), h = [];
  document.documentElement.lang = lang;
  document.title = l.pageTitle;
  h.push('<header class="hero"><div class="hero-in"><div class="top"><div class="brand">' + '<img class="logo" src="cna-logo-white.png" width="80" height="37" alt="Club Nàutic Arenal">' + '</div><button class="lang" data-a="lang" lang="' + (lang === 'es' ? 'en' : 'es') + '">' + esc(l.other) + '</button></div><h1>' + esc(l.title) + '</h1>');
  if (S.fatal) { app.innerHTML = h.join('') + '<p class="sub">' + esc(S.fatal()) + '</p></div>' + WAVE + '</header>'; return; }
  var kids = kidList(), o, d, j, p, on, date;
  h.push('<p class="sub">' + esc(l.intro) + '</p><button class="helpl" data-a="help" aria-expanded="' + (helpOpen() ? 'true' : 'false') + '">' + esc(l.helpLink) + '</button>');
  h.push('<div class="week"><button class="nav" data-a="prev" aria-label="' + esc(l.prev) + '">‹</button><b>' + esc(l.weekend + ' ' + weekLabel(S.week)) + '</b><button class="nav" data-a="next" aria-label="' + esc(l.next) + '">›</button></div>');
  h.push('</div>' + WAVE + '</header><main class="wrap">');
  if (S.offline) { h.push('<div class="bar">' + esc(l.offline) + '</div>'); }
  h.push(helpHtml(l));
  h.push(remindHtml(l));
  if (S.err) { h.push('<p class="err">' + esc(S.err()) + '</p>'); }
  if (!S.loadedKids) { h.push('<p class="muted">' + esc(l.loading) + '</p>'); }
  h.push('<div class="days">');
  for (o = 0; o < ORDER.length; o++) {
    d = ORDER[o];
    date = dayDate(S.week, d);
    p = S.picks[d] || {};
    h.push('<section class="card day' + d + '"><h2>' + flag(d) + '<span class="dn">' + esc(l.days[d]) + ' ' + date.getDate() + '</span><span class="n">' + esc(l.count(picked(d).length)) + '</span></h2><div class="chips">');
    for (j = 0; j < kids.length; j++) {
      on = p[kids[j].id];
      h.push('<button class="chip' + (on ? ' on' : '') + '" data-a="chip" data-d="' + d + '" data-k="' + esc(kids[j].id) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        esc(kids[j].name) + (on && on.note ? '<small>' + esc(on.note) + '</small>' : '') + '</button>');
    }
    h.push('</div></section>');
  }
  h.push('</div><div class="tools">');
  h.push('<div class="sec">' + esc(l.missing) + '</div><div class="row"><input type="text" id="newkid" maxlength="30" placeholder="' + esc(l.kidPh) + '" value="' + esc(S.draftKid) + '" autocomplete="off"><button class="btn" data-a="add">' + esc(l.add) + '</button></div>');
  if (S.msg && S.msgAt === 'add') { h.push('<p class="ok">' + esc(S.msg()) + '</p>'); }
  h.push('<section class="panel summary"><h2>' + LIST + esc(l.sumTitle) + '</h2><div class="sum-grid">');
  for (o = 0; o < ORDER.length; o++) {
    d = ORDER[o];
    p = picked(d);
    h.push('<div class="sum-day"><b><span>' + esc(l.days[d]) + ' ' + dayDate(S.week, d).getDate() + '</span> <span>· ' + p.length + '</span></b>');
    if (p.length) {
      h.push('<ul>');
      for (j = 0; j < p.length; j++) { h.push('<li>' + esc(p[j].name) + (p[j].note ? ' <span>(' + esc(p[j].note) + ')</span>' : '') + '</li>'); }
      h.push('</ul>');
    } else { h.push('<p class="none">' + esc(l.nobody) + '</p>'); }
    h.push('</div>');
  }
  h.push('</div></section>');
  h.push('</div><p class="foot">' + ANCHOR + '<span>v' + VERSION + '</span></p></main>');
  if (S.sheet && S.kids[S.sheet.kid]) {
    h.push('<div class="shade" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><h3>' + esc(S.kids[S.sheet.kid].name) + '</h3><p class="muted">' + esc(l.days[S.sheet.day]) + ' ' + dayDate(S.week, S.sheet.day).getDate() + '</p>' +
      '<div class="row"><input type="text" id="note" maxlength="40" placeholder="' + esc(l.notePh) + '" value="' + esc(S.sheet.note) + '"></div>' +
      '<div class="row"><button class="btn primary" data-a="save" style="flex:1">' + esc(l.saveNote) + '</button><button class="btn danger" data-a="remove">' + esc(l.remove) + '</button></div>' +
      '<button class="btn wide" data-a="close">' + esc(l.close) + '</button></div></div>');
  }
  /* Live updates re-render the page; keep the cursor in a text box someone is typing in. */
  var f = document.activeElement, fid = f && f.id, fv = fid && f.value, fs = fid && f.selectionStart;
  app.innerHTML = h.join('');
  if (fid && document.getElementById(fid)) {
    f = document.getElementById(fid); f.value = fv; f.focus();
    try { f.setSelectionRange(fs, fs); } catch (e) {}
  }
}

app.addEventListener('click', function (ev) {
  var t = ev.target, a;
  while (t && t !== app && !t.getAttribute('data-a')) { t = t.parentNode; }
  if (!t || t === app) { return; }
  a = t.getAttribute('data-a');
  if (a === 'close' && t.className === 'shade' && ev.target !== t) { return; }
  if (a === 'chip') { tapChip(+t.getAttribute('data-d'), t.getAttribute('data-k')); }
  else if (a === 'prev' || a === 'next') { S.week += a === 'next' ? 1 : -1; S.msg = null; S.err = null; watchWeek(); render(); }
  else if (a === 'save') { saveNote(); }
  else if (a === 'remove') { removePick(); }
  else if (a === 'close') { S.sheet = null; render(); }
  else if (a === 'add') { addKid(); }
  else if (a === 'remics') { openIcs(); }
  else if (a === 'remg') { remDone(); }
  else if (a === 'remalt') { S.remAlt = !S.remAlt; render(); }
  else if (a === 'remagain') { lsSet('rem', ''); render(); }
  else if (a === 'help') {
    if (helpOpen()) { S.help = false; render(); }
    else { S.help = true; render(); var hp = document.querySelector('.howto'); if (hp && hp.scrollIntoView) { hp.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } }
  }
  else if (a === 'lang') { lang = lang === 'es' ? 'en' : 'es'; lsSet('lang', lang); render(); }
});
app.addEventListener('input', function (ev) { if (ev.target.id === 'newkid') { S.draftKid = ev.target.value; } });
app.addEventListener('keydown', function (ev) {
  if (ev.keyCode !== 13) { return; }
  if (ev.target.id === 'newkid') { addKid(); } else if (ev.target.id === 'note') { saveNote(); }
});

/* ---------- start ---------- */
var g = (location.hash || '').replace(/^#/, '');
if (window.SS_PREVIEW) { store = memStore(window.SS_PREVIEW); }
else if (/[?&]demo\b/.test(location.search)) { store = memStore(); }
else if (/^[A-Za-z0-9]{20,40}$/.test(g)) { store = fbStore(g); }
else { S.fatal = say('noLink'); render(); return; }
store.ready['catch'](function (e) { S.fatal = say('connFail', e); render(); });
store.onKids(function (v) { S.kids = v; S.loadedKids = true; render(); });
store.onConn(function (c) { if (c) { S.wasOn = true; } S.offline = S.wasOn && !c; render(); });
watchWeek();
render();
})();
</script>
</body>
