<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Panel de entrenadores · Vela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071E3'/%3E%3Cpath d='M16 5v19M16 6l8 15h-8M15 8L8 21h7M6 25h20' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Coaches' dashboard: the sign-up page's header (logo, language, week switcher), then one card per day with who
   sails (and the parent's note) and a shared coach's note that saves itself. Phones: one column. From 640px:
   two columns, weekdays left (Wednesday above Friday), weekend right (Saturday above Sunday). */
:root{
  color-scheme:light dark;
  --bg:#F3F7FA; --card:#FFFFFF; --field:#FFFFFF; --fg:#0B2545; --fg-2:#4A5D73; --line:#D3DEE8;
  --sea:#0B6FB8; --navy:#0B2545; --navy-2:#134074; --tint:#E3F0F8; --good:#13795B; --bad:#C2273B;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 6px 20px rgba(11,37,69,.07);
  --f0:#2E9A5C; --f1:#2F7FC8; --f2:#2F7FC8; --f3:#2E9A5C; --sun:#F5A83A; --sun-soft:#FFCB80;
  --d0:#D9F0E0; --d0l:#8FCBA3; --d1:#DCEBF8; --d1l:#93BFE6; --d2:#C6DDF3; --d2l:#78ABDA; --d3:#EAF6EE; --d3l:#B3DEC0;
  --font:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#07121F; --card:#0F2236; --field:#132B44; --fg:#EAF2F8; --fg-2:#9FB3C8; --line:#24405E;
    --sea:#2F8FD8; --navy:#040C16; --navy-2:#0B2545; --tint:#16344F; --good:#4CD3A3; --bad:#FF6B7D; --shadow:0 1px 2px rgba(0,0,0,.4);
    --d0:#13301F; --d0l:#33694A; --d1:#12263D; --d1l:#2E5785; --d2:#16304F; --d2l:#3A6A9E; --d3:#10261A; --d3l:#2A573C; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button,textarea{font-family:inherit}
.hero{position:relative;color:#fff;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,#1B5E8C 100%);padding-top:env(safe-area-inset-top)}
.hero-in{max-width:900px;margin:0 auto;padding:14px calc(16px + env(safe-area-inset-right)) 54px calc(16px + env(safe-area-inset-left));position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;height:37px;width:auto}
.lang{position:relative;flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:2px 9px;min-height:20px;font-size:11px;font-weight:600;line-height:1.3;cursor:pointer}
.lang::after{content:"";position:absolute;inset:-12px -10px}
h1{font-size:32px;margin:36px 0 6px;letter-spacing:-.01em;line-height:1.1;font-weight:700;color:var(--sun)}
.sub{color:var(--sun-soft);font-size:16px;margin:0}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 0;max-width:520px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:6px}
.week b{font-size:17px;text-align:center;flex:1;font-weight:600;color:var(--sun)}
.nav{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;display:block}
.wrap{max-width:900px;margin:0 auto;padding:4px calc(16px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.bar{background:var(--bad);color:#fff;border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.muted{color:var(--fg-2);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:640px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto;grid-auto-flow:column;align-items:start} }
.day0{--cardbg:var(--d0);--cardline:var(--d0l)} .day1{--cardbg:var(--d1);--cardline:var(--d1l);--cardbw:1.5px} .day2{--cardbg:var(--d2);--cardline:var(--d2l);--cardbw:1.5px} .day3{--cardbg:var(--d3);--cardline:var(--d3l)}
.card{background:var(--cardbg,var(--card));border:var(--cardbw,1px) solid var(--cardline,var(--line));border-radius:18px;padding:16px 16px 14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{width:22px;height:22px;flex:none}
.n{margin-left:auto;font-size:15px;font-weight:600;color:var(--sea);background:var(--tint);border-radius:20px;padding:4px 10px;white-space:nowrap}
.card ul{margin:4px 0 0;padding-left:22px}
.card li{font-size:17px;margin:4px 0;overflow-wrap:anywhere}
.card li span{color:var(--fg-2);font-size:15px}
.card li.sick{color:var(--fg-2)}
.none{color:var(--fg-2);font-style:italic;margin:4px 0 0;font-size:16px}
.note{margin-top:12px;padding-top:10px;border-top:1px solid var(--cardline,var(--line))}
.note label{display:block;font-size:14px;font-weight:600;color:var(--fg-2);margin-bottom:5px}
.note textarea{display:block;width:100%;min-height:62px;resize:vertical;font-size:16px;line-height:1.35;padding:9px 11px;border-radius:12px;border:1.5px solid var(--cardline,var(--line));background:var(--field);color:var(--fg)}
.note textarea:focus{outline:none;border-color:var(--sea)}
.st{font-size:13px;color:var(--fg-2);margin:4px 2px 0;min-height:17px}
.st.ok{color:var(--good)} .st.err{color:var(--bad)}
.foot{margin-top:26px;font-size:15px;text-align:center}
.foot a{color:var(--sea);font-weight:600}
.ver{margin-top:10px;font-size:13px;color:var(--fg-2);text-align:center}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Cargando… / Loading…</p></div>
<noscript><p style="padding:20px">Esta página necesita JavaScript. This page needs JavaScript.</p></noscript>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-database-compat.js"></script>
<script>
/* Coaches' dashboard. Own code is ES5 on purpose (var and function only). Reads the same group as the sign-up page
   (key from the link's #part); writes only groups/<g>/coachNotes/<Friday>/<day> {text, at}. */
(function () {
'use strict';
var VERSION = '1.1.0';
var FB = {
  apiKey: 'AIzaSyD3Q2TRCGlCkJPd8wvf8aijdQU8a0oJXmc',
  authDomain: 'sailing-signup.firebaseapp.com',
  databaseURL: 'https://sailing-signup-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'sailing-signup',
  appId: '1:1090198402941:web:30a83e8de794f93cff7e14'
};
var LS = 'ss1_';
var BASE = 'https://tasar1-ship-it.github.io/sailing-signup/';
var T = {
  es: {
    other: 'English', title: 'Panel de entrenadores', sub: 'Quién navega cada día. Se actualiza solo.',
    days: ['Viernes', 'Sábado', 'Domingo', 'Miércoles'], months: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'],
    weekend: 'Semana', prev: 'Semana anterior', next: 'Semana siguiente', loading: 'Cargando…', nobody: 'nadie apuntado',
    count: function (n) { return n + (n === 1 ? ' apuntado' : ' apuntados'); }, sick: 'Enfermo/a', late: 'Llega tarde',
    noteLabel: 'Nota del entrenador', notePh: 'P. ej. salida 10:00, traer neopreno',
    saving: 'Guardando…', saved: 'Guardado', saveFail: 'No se guardó. Revisa la conexión.',
    parents: 'Abrir la página de los padres',
    offline: 'Sin conexión. Las notas se guardarán al volver la conexión.',
    readFail: 'No se pudo leer la lista. Revisa la conexión y recarga.', connFail: 'No se pudo conectar. Revisa la conexión y recarga.',
    noLink: 'Abre el panel con el enlace completo de la guía de entrenadores.'
  },
  en: {
    other: 'Español', title: 'Coaches’ dashboard', sub: 'Who sails each day. Updates by itself.',
    days: ['Friday', 'Saturday', 'Sunday', 'Wednesday'], months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
    weekend: 'Week', prev: 'Previous week', next: 'Next week', loading: 'Loading…', nobody: 'nobody signed up',
    count: function (n) { return n + ' signed up'; }, sick: 'Sick', late: 'Running late',
    noteLabel: 'Coach’s note', notePh: 'E.g. start 10:00, bring a wetsuit',
    saving: 'Saving…', saved: 'Saved', saveFail: 'Not saved. Check the connection.',
    parents: 'Open the parents’ page',
    offline: 'Offline. Notes will be saved when the connection is back.',
    readFail: 'Could not read the list. Check the connection and reload.', connFail: 'Could not connect. Check the connection and reload.',
    noLink: 'Open the dashboard with the full link from the coaches’ guide.'
  }
};
var LOGO = '<img class="logo" src="cna-logo-white.png" width="80" height="37" alt="Club Nàutic Arenal">';
var WAVE = '<svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 34C200 6 380 64 620 40S1060 2 1240 26 1440 38 1440 38V80H0z" style="fill:var(--bg);opacity:.35"/><path d="M0 52C240 26 460 78 720 54S1180 22 1440 50V80H0z" style="fill:var(--bg)"/></svg>';
var FLAGS = ['var(--f0)', 'var(--f1)', 'var(--f2)', 'var(--f3)'];
function flag(i) { return '<svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5v19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 3.5l14 5.5-14 5.5z" style="fill:' + FLAGS[i] + '"/></svg>'; }
function lsGet(k) { try { return localStorage.getItem(LS + k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) {} }
var lang = lsGet('lang');
if (lang !== 'es' && lang !== 'en') { lang = /^en/i.test(navigator.language || '') ? 'en' : 'es'; }
function L() { return T[lang]; }
var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }

/* Same week logic as the sign-up page: Mon-Fri shows the coming Friday's week, Sat/Sun the current one.
   Days: 0 Friday, 1 Saturday, 2 Sunday, 3 Wednesday (two days before Friday). */
var ORDER = [3, 0, 1, 2];
function friday(offset) {
  var d = new Date(); d.setHours(12, 0, 0, 0);
  var wd = d.getDay(), back = wd === 6 ? 1 : (wd === 0 ? 2 : -(5 - wd));
  d.setDate(d.getDate() - back + 7 * offset);
  return d;
}
function weekId(offset) { var d = friday(offset); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayDate(offset, i) { var d = friday(offset); d.setDate(d.getDate() + (i === 3 ? -2 : i)); return d; }
function weekLabel(offset) {
  var a = dayDate(offset, 3), b = dayDate(offset, 2), m = L().months;
  var s = a.getMonth() === b.getMonth() ? a.getDate() : a.getDate() + ' ' + m[a.getMonth()];
  return s + ' – ' + b.getDate() + ' ' + m[b.getMonth()];
}

var app = document.getElementById('app');
var S = { fatal: '', week: 0, kids: {}, picks: {}, notes: {}, loaded: false, offline: false, wasOn: false, draft: {}, st: {} };
var store = null, offWeek = null, timers = {};

/* ---------- stores: Firebase, or in memory for ?demo ---------- */
function fbStore(g) {
  var ready = new Promise(function (res, rej) {
    if (typeof firebase === 'undefined') { rej('no-sdk'); return; }
    try { firebase.initializeApp(FB); } catch (e) { rej('no-sdk'); return; }
    firebase.auth().signInAnonymously().then(function () { res(firebase.database()); }).catch(function (e) { rej((e && e.code) || 'no-auth'); });
  });
  function base(db) { return db.ref('groups/' + g); }
  return {
    ready: ready,
    onKids: function (cb) { ready.then(function (db) { base(db).child('kids').on('value', function (s) { cb(s.val() || {}); }, onFail); }); },
    onWeek: function (w, cbPicks, cbNotes) {
      var a = null, b = null;
      ready.then(function (db) {
        a = base(db).child('picks/' + w); a.on('value', function (s) { cbPicks(s.val() || {}); }, onFail);
        b = base(db).child('coachNotes/' + w); b.on('value', function (s) { cbNotes(s.val() || {}); }, onFail);
      });
      return function () { if (a) { a.off(); } if (b) { b.off(); } };
    },
    setNote: function (w, day, text) {
      return ready.then(function (db) {
        var r = base(db).child('coachNotes/' + w + '/' + day);
        return text ? r.set({ text: text, at: firebase.database.ServerValue.TIMESTAMP }) : r.remove();
      });
    },
    onConn: function (cb) { ready.then(function (db) { db.ref('.info/connected').on('value', function (s) { cb(!!s.val()); }); }); }
  };
}
function memStore() {
  var kids = { k1: { name: 'Ana' }, k2: { name: 'Bruno' }, k3: { name: 'Carla' }, k4: { name: 'Dani' } }, picks = {}, notes = {}, cbs = {};
  var w0 = weekId(0); picks[w0] = { 1: { k1: { note: '', at: 1 }, k3: { note: 'hasta las 14', at: 2 } }, 2: { k2: { note: '', at: 1 } } };
  function emit(w) { if (cbs[w]) { cbs[w][0](JSON.parse(JSON.stringify(picks[w] || {}))); cbs[w][1](JSON.parse(JSON.stringify(notes[w] || {}))); } }
  return {
    ready: Promise.resolve(),
    onKids: function (cb) { setTimeout(function () { cb(kids); }, 0); },
    onWeek: function (w, a, b) { cbs[w] = [a, b]; setTimeout(function () { emit(w); }, 0); return function () { delete cbs[w]; }; },
    setNote: function (w, day, text) { notes[w] = notes[w] || {}; if (text) { notes[w][day] = { text: text, at: new Date().getTime() }; } else { delete notes[w][day]; } emit(w); return Promise.resolve(); },
    onConn: function () {}
  };
}
function onFail() { S.fatal = 'readFail'; render(); }

/* ---------- actions ---------- */
function watchWeek() {
  if (offWeek) { offWeek(); }
  S.picks = {}; S.notes = {}; S.draft = {}; S.st = {};
  offWeek = store.onWeek(weekId(S.week), function (v) { S.picks = v; render(); }, function (v) { S.notes = v; render(); });
}
function noteText(d) { var n = S.notes[d]; return n && n.text ? n.text : ''; }
function saveNote(d) {
  if (!(d in S.draft)) { return; }
  var text = String(S.draft[d]).replace(/^\s+|\s+$/g, '').slice(0, 500), w = weekId(S.week);
  if (text === noteText(d)) { delete S.draft[d]; return; }
  S.st[d] = 'saving'; paintStatus(d);
  store.setNote(w, d, text).then(function () {
    if (w !== weekId(S.week)) { return; }
    S.st[d] = 'saved'; if (S.draft[d] !== undefined && String(S.draft[d]).replace(/^\s+|\s+$/g, '') === text) { delete S.draft[d]; }
    paintStatus(d);
  })['catch'](function () { S.st[d] = 'err'; paintStatus(d); });
}
function paintStatus(d) {
  var el = document.getElementById('st' + d); if (!el) { return; }
  var s = S.st[d], l = L();
  el.className = 'st' + (s === 'saved' ? ' ok' : s === 'err' ? ' err' : '');
  el.textContent = s === 'saving' ? l.saving : s === 'saved' ? l.saved : s === 'err' ? l.saveFail : '';
}

/* ---------- render ---------- */
/* Parents mark sick or late as a mark at the start of their note (sign-up page 1.7.0). */
var MARKS = { sick: '🤒', late: '⏰' };
function parseNote(note) {
  var st;
  note = note || '';
  for (st in MARKS) { if (note.indexOf(MARKS[st]) === 0) { return { st: st, text: note.slice(MARKS[st].length).replace(/^ /, '') }; } }
  return { st: '', text: note };
}
function showNote(note) {
  var n = parseNote(note), l = L();
  return (n.st ? MARKS[n.st] + ' ' + l[n.st] : '') + (n.st && n.text ? ' · ' : '') + n.text;
}
function sailing(list) { var n = 0, j; for (j = 0; j < list.length; j++) { if (!list[j].sick) { n++; } } return n; }
function picked(d) {
  var p = S.picks[d] || {}, out = [], k;
  for (k in p) { if (S.kids[k]) { out.push({ name: S.kids[k].name, note: p[k].note || '', at: p[k].at || 0, sick: parseNote(p[k].note).st === 'sick' }); } }
  out.sort(function (a, b) { return a.at - b.at; });
  return out;
}
function render() {
  var l = L(), h = [], o, d, p, j, date, val;
  document.documentElement.lang = lang;
  document.title = l.title + ' · Vela';
  h.push('<header class="hero"><div class="hero-in"><div class="top">' + LOGO + '<button class="lang" data-a="lang">' + esc(l.other) + '</button></div><h1>' + esc(l.title) + '</h1>');
  if (S.fatal) { app.innerHTML = h.join('') + '<p class="sub">' + esc(l[S.fatal]) + '</p></div>' + WAVE + '</header>'; return; }
  h.push('<p class="sub">' + esc(l.sub) + '</p>');
  h.push('<div class="week"><button class="nav" data-a="prev" aria-label="' + esc(l.prev) + '">‹</button><b>' + esc(l.weekend + ' ' + weekLabel(S.week)) + '</b><button class="nav" data-a="next" aria-label="' + esc(l.next) + '">›</button></div>');
  h.push('</div>' + WAVE + '</header><main class="wrap">');
  if (S.offline) { h.push('<div class="bar">' + esc(l.offline) + '</div>'); }
  if (!S.loaded) { h.push('<p class="muted">' + esc(l.loading) + '</p>'); }
  h.push('<div class="grid">');
  for (o = 0; o < ORDER.length; o++) {
    d = ORDER[o]; p = picked(d); date = dayDate(S.week, d);
    val = d in S.draft ? S.draft[d] : noteText(d);
    h.push('<section class="card day' + d + '"><h2>' + flag(d) + '<span>' + esc(l.days[d]) + ' ' + date.getDate() + '</span><span class="n">' + esc(l.count(sailing(p))) + '</span></h2>');
    if (p.length) {
      h.push('<ul>');
      for (j = 0; j < p.length; j++) { h.push('<li' + (p[j].sick ? ' class="sick"' : '') + '>' + esc(p[j].name) + (p[j].note ? ' <span>(' + esc(showNote(p[j].note)) + ')</span>' : '') + '</li>'); }
      h.push('</ul>');
    } else { h.push('<p class="none">' + esc(l.nobody) + '</p>'); }
    h.push('<div class="note"><label for="note' + d + '">' + esc(l.noteLabel) + '</label><textarea id="note' + d + '" data-d="' + d + '" maxlength="500" placeholder="' + esc(l.notePh) + '">' + esc(val) + '</textarea><p class="st" id="st' + d + '" aria-live="polite"></p></div></section>');
  }
  h.push('</div><p class="foot"><a href="' + esc(BASE + (g ? '#' + g : '')) + '" target="_blank" rel="noopener">' + esc(l.parents) + '</a></p><p class="ver">v' + VERSION + '</p></main>');
  /* Live updates re-render; keep the cursor where a coach is typing. */
  var f = document.activeElement, fid = f && f.id, fs = fid && f.selectionStart, fe = fid && f.selectionEnd;
  app.innerHTML = h.join('');
  for (o = 0; o < ORDER.length; o++) { paintStatus(ORDER[o]); }
  if (fid && document.getElementById(fid)) {
    f = document.getElementById(fid); f.focus();
    try { f.setSelectionRange(fs, fe); } catch (e) {}
  }
}

app.addEventListener('click', function (ev) {
  var t = ev.target;
  while (t && t !== app && !(t.getAttribute && t.getAttribute('data-a'))) { t = t.parentNode; }
  if (!t || t === app) { return; }
  var a = t.getAttribute('data-a');
  if (a === 'lang') { lang = lang === 'es' ? 'en' : 'es'; lsSet('lang', lang); render(); }
  else if (a === 'prev' || a === 'next') {
    var k; for (k in S.draft) { saveNote(+k); }
    S.week += a === 'next' ? 1 : -1; watchWeek(); render();
  }
});
app.addEventListener('input', function (ev) {
  var t = ev.target; if (t.tagName !== 'TEXTAREA') { return; }
  var d = +t.getAttribute('data-d');
  S.draft[d] = t.value; S.st[d] = ''; paintStatus(d);
  clearTimeout(timers[d]);
  timers[d] = setTimeout(function () { saveNote(d); }, 900);
});
app.addEventListener('focusout', function (ev) {
  var t = ev.target; if (t.tagName !== 'TEXTAREA') { return; }
  var d = +t.getAttribute('data-d'); clearTimeout(timers[d]); saveNote(d);
});

/* ---------- start ---------- */
var g = (location.hash || '').replace(/^#/, '');
if (/[?&]demo\b/.test(location.search)) { store = memStore(); g = ''; }
else if (/^[A-Za-z0-9]{20,40}$/.test(g)) { store = fbStore(g); }
else { S.fatal = 'noLink'; render(); return; }
store.ready['catch'](function () { S.fatal = 'connFail'; render(); });
store.onKids(function (v) { S.kids = v; S.loaded = true; render(); });
store.onConn(function (c) { if (c) { S.wasOn = true; } S.offline = S.wasOn && !c; render(); });
watchWeek();
render();
})();
</script>
</body>
</html>
